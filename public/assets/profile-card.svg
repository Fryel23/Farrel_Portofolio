    <rect x="181" y="296" width="2" height="40"/><rect x="188" y="296" width="6" height="40"/>
    <rect x="199" y="296" width="3" height="40"/><rect x="207" y="296" width="7" height="40"/>
    <rect x="219" y="296" width="2" height="40"/><rect x="226" y="296" width="9" height="40"/>
    <rect x="240" y="296" width="4" height="40"/><rect x="249" y="296" width="2" height="40"/>
