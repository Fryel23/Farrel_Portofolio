    <rect x="130" y="144" width="8" height="20" fill="#0F172A"/>
    <rect x="86" y="152" width="10" height="10" fill="#0F172A"/>
    <rect x="104" y="152" width="10" height="10" fill="#0F172A"/>
    <rect x="88" y="170" width="24" height="4" fill="#2563EB"/>
    <rect x="66" y="180" width="68" height="20" fill="#2563EB"/>
    <rect x="58" y="196" width="16" height="28" fill="#2563EB"/>
