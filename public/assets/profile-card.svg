  <text x="196" y="134" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0F172A">Farrel Islami Putra</text>
  <text x="196" y="160" font-family="ui-monospace, Consolas, monospace" font-size="9" letter-spacing="2" fill="#64748B">FIELD</text>
  <text x="196" y="182" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0F172A">Informatics Engineering</text>
  <text x="196" y="208" font-family="ui-monospace, Consolas, monospace" font-size="9" letter-spacing="2" fill="#64748B">FOCUS</text>
  <text x="196" y="230" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#2563EB">SW · DATA · IoT</text>

