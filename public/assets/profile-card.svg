<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 440" role="img" aria-label="Personal file card of Farrel Islami Putra">
  <!-- shadow card -->
  <rect x="16" y="20" width="396" height="398" fill="#DBEAFE"/>
  <!-- main card -->
  <rect x="8" y="8" width="396" height="398" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
